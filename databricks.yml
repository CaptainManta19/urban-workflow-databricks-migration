# This is a Declarative Automation Bundle definition for urban_workflow.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: urban_workflow
  uuid: 622dd660-0a27-4e19-bc72-550a48a4e800

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the development target below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use
  raw_volume:
    description: The Unity Catalog volume containing the staged source snapshots
    default: raw_sources

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-6735c62d-d6ab.cloud.databricks.com
    variables:
      catalog: workspace
      # Reuse the Unity Catalog schema and volume proven during the exploratory test.
      schema: urban_workflow
      raw_volume: raw_sources
